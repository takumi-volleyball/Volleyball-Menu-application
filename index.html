<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>バレー練習メニュー作成</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🏐 バレー練習メニュー作成</h1>
        <button onclick="openMenuManager()">
        ⚙️ メニュー管理
        </button>
        <div id="menuManager" style="display: none;">

    
    <div class="category-manager">

    <h3>新しいカテゴリーを追加</h3>

    <input
        type="text"
        id="newCategoryName"
        placeholder="例：スリーメン"
    >

    <button onclick="addNewCategory()">
        ＋ カテゴリーを追加
    </button>

</div>        
<h2>⚙️ メニュー管理</h2>

    <label>カテゴリー</label>

    <select id="managerCategory">
        <option value="">カテゴリーを選択</option>
        <option value="アップ">アップ</option>
        <option value="パス">パス</option>
        <option value="レセプション">レセプション</option>
        <option value="ディグ">ディグ</option>
        <option value="サーブ">サーブ</option>
        <option value="スパイク">スパイク</option>
        <option value="ブロック">ブロック</option>
        <option value="複合練">複合練</option>
    </select>

    <br><br>

    <label>新しいメニュー</label>

    <input
        type="text"
        id="newMenuName"
        placeholder="例：サーブ→切り返し"
    >

    <button onclick="addNewMenu()">
        ＋ メニューを追加
    </button>
<h3>登録されているメニュー</h3>

<div id="managerMenuList"></div>
</div>
        <div class="practice-time">

    <label>今日の練習時間（分）</label>

    <input
        type="number"
        id="practiceTime"
        min="1"
        value="180"
    >

</div>
        
        

        <div class="input-area">

            <label>カテゴリー</label>

            <select id="category">
                <option value="">選択してください</option>
                <option value="アップ">アップ</option>
                <option value="パス">パス</option>
                <option value="レセプション">レセプション</option>
                <option value="ディグ">ディグ</option>
                <option value="サーブ">サーブ</option>
                <option value="スパイク">スパイク</option>
                <option value="ブロック">ブロック</option>
                <option value="複合練">複合練</option>
                <option value="その他">その他</option>
            </select>

            <label>メニュー</label>

            <select id="menu">
                <option value="">カテゴリーを選択してください</option>
            </select>

            <label>時間（分）</label>

            <input type="number" id="time" min="1" value="10">

            <label>セット数</label>

            <input type="number" id="sets" min="1" value="1">

            <button onclick="addMenu()">＋ メニューを追加</button>

        </div>

        <h2>今日の練習メニュー</h2>

        <div id="menuList"></div>

        <h3>
    合計時間：<span id="totalTime">0</span>分
</h3>

<h3>
    残り時間：<span id="remainingTime">180</span>分
</h3>

<button onclick="copyTrainingMenu()">
    📋 練習メニューをコピー
</button>

<button onclick="clearTrainingMenus()">
    🗑️ 全部クリア
</button>

    </div>

    <script src="script.js"></script>

</body>
</html>
